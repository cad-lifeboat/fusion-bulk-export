<svg xmlns="http://www.w3.org/2000/svg" width="820" height="840" viewBox="0 0 820 840">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1720"/><stop offset="1" stop-color="#16212d"/></linearGradient></defs>
<rect width="820" height="840" rx="12" fill="url(#g)"/>
<rect x="153" y="34" width="520" height="778" rx="8" fill="#000" opacity="0.35"/><rect x="150" y="28" width="520" height="778" rx="8" fill="#f4f5f7" stroke="#c4ccd5"/><path d="M150,36 a8,8 0 0 1 8,-8 h504 a8,8 0 0 1 8,8 v26 h-520 z" fill="#e4e7eb"/><path d="M150,62 h520" stroke="#c4ccd5"/><path d="M166,39 l7,3.5 l-7,3.5 l-7,-3.5 z" fill="#f6b26b"/><path d="M159,42.5 l7,3.5 v7 l-7,-3.5 z" fill="#d9731a"/><path d="M173,42.5 l-7,3.5 v7 l7,-3.5 z" fill="#b85f12"/><text x="182" y="50" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start">Fusion Bulk Export</text><text x="654" y="50" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5d6670" text-anchor="middle">×</text><text x="166" y="86" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5d6670" text-anchor="start">Fusion Bulk Export 0.3.0</text><text x="166" y="117" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Save to</text><rect x="402" y="100" width="86" height="26" rx="4" fill="#ffffff" stroke="#c4ccd5"/><text x="445.0" y="117.5" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">Browse…</text><text x="166" y="146" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">/Users/you/Documents/FusionExport</text><text x="166" y="168" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Continues the export in this folder (42 done).</text><text x="166" y="194" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Also save a STEP file for each design</text><rect x="402" y="184" width="12" height="12" rx="3" fill="#0a6fc2" stroke="#0a6fc2" stroke-width="1.5"/><path d="M405,190.2 l2.4,2.4 l4.2,-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="220" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Also save other files (PDFs, uploads)</text><rect x="402" y="210" width="12" height="12" rx="3" fill="#0a6fc2" stroke="#0a6fc2" stroke-width="1.5"/><path d="M405,216.2 l2.4,2.4 l4.2,-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="246" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Tool libraries</text><rect x="402" y="236" width="12" height="12" rx="3" fill="#0a6fc2" stroke="#0a6fc2" stroke-width="1.5"/><path d="M405,242.2 l2.4,2.4 l4.2,-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="272" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Your CAM tool libraries, one .json file each.</text><text x="166" y="298" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Also build .f3z for assemblies</text><rect x="402" y="288" width="12" height="12" rx="3" fill="none" stroke="#6b7480" stroke-width="1.5"/><text x="166" y="324" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">A single file with its inserted designs, beside the .f3d.</text><text x="166" y="359" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Older versions of a design</text><rect x="402" y="342" width="252" height="26" rx="3" fill="#ffffff" stroke="#c4ccd5"/><text x="410" y="359" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">Move to the Older versions folder</text><path d="M636,353 h8 l-4,5 z" fill="#5d6670"/><text x="166" y="386" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Older versions move to the Older versions folder.</text><text x="166" y="417" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Export</text><rect x="402" y="400" width="252" height="26" rx="3" fill="#ffffff" stroke="#c4ccd5"/><text x="410" y="417" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">Choose projects or folders</text><path d="M636,411 h8 l-4,5 z" fill="#5d6670"/><text x="166" y="448" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">1 whole project and 1 folder chosen.</text><text x="166" y="474" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Tick what to export. Ticking a folder includes everything inside it. Keys:</text><text x="166" y="490" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">arrows move and open, Space ticks, Enter opens.</text><rect x="166" y="500" width="488" height="24" rx="4" fill="#ffffff" stroke="#c4ccd5"/><text x="174" y="516" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#8d97a4" text-anchor="start">Filter projects by name</text><path d="M169,542 h8 l-4,5 z" fill="#5d6670"/><rect x="186" y="538" width="12" height="12" rx="3" fill="none" stroke="#0a6fc2" stroke-width="1.5"/><rect x="188.5" y="543" width="7" height="2" fill="#0a6fc2"/><circle cx="210" cy="544" r="6" fill="#6b7480"/><text x="224" y="548" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">My Hub</text><path d="M185,566 h8 l-4,5 z" fill="#5d6670"/><rect x="202" y="562" width="12" height="12" rx="3" fill="none" stroke="#0a6fc2" stroke-width="1.5"/><rect x="204.5" y="567" width="7" height="2" fill="#0a6fc2"/><rect x="220" y="562" width="14" height="12" rx="2" fill="#f08a24"/><text x="240" y="572" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">Robot Arm</text><text x="311.0" y="572" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">14 files</text><text x="371.8" y="572" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#1a7f37" text-anchor="start">9 exported</text><rect x="163" y="581" width="494" height="22" rx="4" fill="none" stroke="#0a6fc2" stroke-width="2"/><path d="M203,588 v8 l5,-4 z" fill="#5d6670"/><rect x="218" y="586" width="12" height="12" rx="3" fill="#0a6fc2" stroke="#0a6fc2" stroke-width="1.5"/><path d="M221,592.2 l2.4,2.4 l4.2,-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M236,587.8 h5.6 l1.4,1.8 h7 v8.4 h-14 z" fill="#c9a23f"/><text x="256" y="596" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">Brackets</text><path d="M203,612 v8 l5,-4 z" fill="#5d6670"/><rect x="218" y="610" width="12" height="12" rx="3" fill="none" stroke="#6b7480" stroke-width="1.5"/><path d="M236,611.8 h5.6 l1.4,1.8 h7 v8.4 h-14 z" fill="#c9a23f"/><text x="256" y="620" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">Gripper</text><path d="M203,636 v8 l5,-4 z" fill="#5d6670"/><rect x="218" y="634" width="12" height="12" rx="3" fill="none" stroke="#6b7480" stroke-width="1.5"/><path d="M236,635.8 h5.6 l1.4,1.8 h7 v8.4 h-14 z" fill="#c9a23f"/><text x="256" y="644" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">Wiring</text><path d="M187,660 v8 l5,-4 z" fill="#5d6670"/><rect x="202" y="658" width="12" height="12" rx="3" fill="none" stroke="#6b7480" stroke-width="1.5"/><rect x="220" y="658" width="14" height="12" rx="2" fill="#f08a24"/><text x="240" y="668" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">Desk Lamp</text><path d="M187,684 v8 l5,-4 z" fill="#5d6670"/><rect x="202" y="682" width="12" height="12" rx="3" fill="#0a6fc2" stroke="#0a6fc2" stroke-width="1.5"/><path d="M205,688.2 l2.4,2.4 l4.2,-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="220" y="682" width="14" height="12" rx="2" fill="#f08a24"/><text x="240" y="692" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">Shop Jigs</text><text x="311.0" y="692" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#1a7f37" text-anchor="start">33 exported</text><path d="M169,710 h8 l-4,5 z" fill="#5d6670"/><rect x="186" y="706" width="12" height="12" rx="3" fill="none" stroke="#6b7480" stroke-width="1.5"/><circle cx="210" cy="712" r="6" fill="#6b7480"/><text x="224" y="716" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">Makerspace</text><path d="M187,732 v8 l5,-4 z" fill="#5d6670"/><rect x="202" y="730" width="12" height="12" rx="3" fill="none" stroke="#6b7480" stroke-width="1.5"/><rect x="220" y="730" width="14" height="12" rx="2" fill="#f08a24"/><text x="240" y="740" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">Go-kart</text><path d="M150,756 h520" stroke="#c4ccd5"/><rect x="486" y="768" width="80" height="26" rx="4" fill="#0a6fc2" stroke="#0a6fc2"/><text x="526.0" y="785.5" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Export</text><rect x="574" y="768" width="80" height="26" rx="4" fill="#ffffff" stroke="#c4ccd5"/><text x="614.0" y="785.5" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">Cancel</text>
