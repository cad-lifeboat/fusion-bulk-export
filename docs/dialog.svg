12" font-weight="400" fill="#5d6670" text-anchor="start">Also save other files (PDFs, uploads)</text><rect x="402" y="184" width="12" height="12" rx="3" fill="#0a6fc2" stroke="#0a6fc2" stroke-width="1.5"/><path d="M405,190.2 l2.4,2.4 l4.2,-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="220" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Include linked parts in assemblies</text><rect x="402" y="210" width="12" height="12" rx="3" fill="#0a6fc2" stroke="#0a6fc2" stroke-width="1.5"/><path d="M405,216.2 l2.4,2.4 l4.2,-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="246" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Adds a second, larger .f3d for each assembly, with its linked parts inside.</text><text x="166" y="281" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Export</text><rect x="402" y="264" width="252" height="26" rx="3" fill="#ffffff" stroke="#c4ccd5"/><text x="410" y="281" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">Choose projects or folders</text><path d="M636,275 h8 l-4,5 z" fill="#5d6670"/><text x="166" y="312" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">1 whole project and 1 folder chosen.</text><text x="166" y="338" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Tick what to export. Ticking a folder includes everything inside it. Keys:</text><text x="166" y="354" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">arrows move and open, Space ticks, Enter opens.</text><rect x="166" y="364" width="488" height="24" rx="4" fill="#ffffff" stroke="#c4ccd5"/><text x="174" y="380" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#8d97a4" text-anchor="start">Filter projects by name</text><path d="M169,406 h8 l-4,5 z" fill="#5d6670"/><rect x="186" y="402" width="12" height="12" rx="3" fill="none" stroke="#0a6fc2" stroke-width="1.5"/><rect x="188.5" y="407" width="7" height="2" fill="#0a6fc2"/><circle cx="210" cy="408" r="6" fill="#6b7480"/><text x="224" y="412" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">My Hub</text><path d="M185,430 h8 l-4,5 z" fill="#5d6670"/><rect x="202" y="426" width="12" height="12" rx="3" fill="none" stroke="#0a6fc2" stroke-width="1.5"/><rect x="204.5" y="431" width="7" height="2" fill="#0a6fc2"/><rect x="220" y="426" width="14" height="12" rx="2" fill="#f08a24"/><text x="240" y="436" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">Robot Arm</text><text x="311.0" y="436" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">14 files</text><text x="371.8" y="436" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#1a7f37" text-anchor="start">9 exported</text><rect x="163" y="445" width="494" height="22" rx="4" fill="none" stroke="#0a6fc2" stroke-width="2"/><path d="M203,452 v8 l5,-4 z" fill="#5d6670"/><rect x="218" y="450" width="12" height="12" rx="3" fill="#0a6fc2" stroke="#0a6fc2" stroke-width="1.5"/><path d="M2