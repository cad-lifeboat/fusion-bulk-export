12" font-weight="400" fill="#5d6670" text-anchor="start">Also save a STEP file for each design</text><rect x="402" y="184" width="12" height="12" rx="3" fill="#0a6fc2" stroke="#0a6fc2" stroke-width="1.5"/><path d="M405,190.2 l2.4,2.4 l4.2,-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="220" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Also save other files (PDFs, uploads)</text><rect x="402" y="210" width="12" height="12" rx="3" fill="#0a6fc2" stroke="#0a6fc2" stroke-width="1.5"/><path d="M405,216.2 l2.4,2.4 l4.2,-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="255" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Export</text><rect x="402" y="238" width="252" height="26" rx="3" fill="#ffffff" stroke="#c4ccd5"/><text x="410" y="255" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">Choose projects or folders</text><path d="M636,249 h8 l-4,5 z" fill="#5d6670"/><text x="166" y="286" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">1 whole project and 1 folder chosen.</text><text x="166" y="312" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">Tick what to export. Ticking a folder includes everything inside it. Keys:</text><text x="166" y="328" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6670" text-anchor="start">arrows move and open, Space ticks, Enter opens.</text><rect x="166" y="338" width="488" height="2