<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose what to export</title>
<style>
  :root { --text: #e3e6ea; --muted: #9aa4b1; --hover: rgba(255, 255, 255, 0.07); --box: #8d97a4; --tick: #2f9bd8;
    --bad: #ff8178; --line: #4a515b; --good: #56d364; color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root { --text: #1f2328; --muted: #5d6670; --hover: rgba(0, 0, 0, 0.06); --box: #6b7480; --tick: #0a6fc2;
      --bad: #b42318; --line: #c4ccd5; --good: #1a7f37; color-scheme: light; }
  }
  /* The page must read well from about 220 px to 900 px wide: never a horizontal scrollbar; long
     names end in an ellipsis (the full name is the row's tooltip); counts and badges stay whole. */
  html, body { margin: 0; background: transparent; color: var(--text); overflow-x: hidden; max-width: 100%;
    font: 12px -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; user-select: none; }
  /* Height by construction (the dialog sets the same minimum on the input, picker.py
     TREE_MIN_HEIGHT): never decided by how much the page holds, so an empty or loading tree is as
     tall as a full one. */
  html, body { min-height: 260px; }
  /* Scrollbars in the page's own colours, not a bright white track on the dark theme. */
  html { scrollbar-color: var(--line) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; background: transparent; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 2px solid transparent;
    background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--box); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  * { box-sizing: border-box; }
  ul { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; align-items: center; gap: 6px; height: 24px; border-radius: 4px; cursor: default;
    min-width: 0; overflow: hidden; }
  .row:hover { background: var(--hover); }
  .caret { width: 14px; text-align: center; color: var(--muted); cursor: pointer; flex: none; }
  .caret.leaf { cursor: default; }
  .box { width: 12px; height: 12px; border: 1.5px solid var(--box); border-radius: 3px; flex: none; position: relative; }
  .box.on { background: var(--tick); border-color: var(--tick); }
  .box.on::after { content: ""; position: absolute; left: 3px; top: 0; width: 4px; height: 8px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .box.some { border-color: var(--tick); }
  .box.some::after { content: ""; position: absolute; left: 2px; right: 2px; top: 4.5px; height: 2px; background: var(--tick); }
  .icon { width: 14px; height: 12px; flex: none; border-radius: 2px; }
  .icon.hub { background: #6b7480; border-radius: 50%; width: 12px; }
  .icon.project { background: #f08a24; }
  .icon.folder { background: #c9a23f; clip-path: polygon(0 15%, 40% 15%, 50% 30%, 100% 30%, 100% 100%, 0 100%); }
  .label { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty, .loading { color: var(--muted); min-height: 22px; line-height: 22px; font-style: italic; }
  .error { color: var(--bad); min-height: 22px; line-height: 22px; }
  .retry { font: inherit; margin-left: 6px; padding: 0 8px; border: 1px solid var(--line); border-radius: 4px;
    background: transparent; color: var(--text); cursor: pointer; }
  .count { color: var(--muted); flex: none; white-space: nowrap; }
  .badge { color: var(--good); flex: none; white-space: nowrap; font-size: 11px; padding-right: 4px; }
  [role="treeitem"]:focus { outline: none; }
  [role="treeitem"]:focus > .row { box-shadow: inset 0 0 0 2px var(--tick); }
  .hint { color: var(--muted); margin: 4px 4px 6px; line-height: 1.35; }
  #filter { display: block; width: calc(100% - 8px); min-width: 0; margin: 0 4px 6px; padding: 3px 6px; font: inherit;
    color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 4px; }
  /* Very narrow: drop the per-row icon and the key help rather than the names. */
  @media (max-width: 259px) {
    .icon { display: none; }
    .keys { display: none; }
  }
</style>
</head>
<body>
  <div class="hint">Tick what to export. Ticking a folder includes everything inside it.
    <span class="keys">Keys: arrows move and open, Space ticks, Enter opens.</span></div>
  <input id="filter" type="search" placeholder="Filter projects by name" aria-label="Filter projects by name">
  <ul id="tree" role="tree" aria-label="Hubs, projects and folders"><li class="empty">Loading your hubs…</li></ul>
  <script src="tree.js"></script>
</body>
</html>
